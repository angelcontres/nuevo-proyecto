schema: spec-driven
version: "1.0"
project: red-social-distribuida

## Todos los comandos se ejecutan desde este directorio, no desde la raíz del repo.
working_dir: backend

## Project Context
context: |
  Tech Stack: Quarkus + Java + Maven, Neo4j 5.20 + APOC (Grafo Social), MinIO S3, WebSockets de Quarkus, Web Push / VAPID, React 18 + Vite + TypeScript + Tailwind.
  Architecture: Arquitectura Hexagonal en 4 anillos (domain, port/in, port/out, application, infrastructure).
  Testing: No existe configuración de pruebas actualmente.
  Style: No existe configurado linter ni formatter.
  Deployment: Docker Compose, red bridge red-distribuida, datos semilla en docker/neo4j-seed.cql.

## Testing & Quality
testing:
  strict_tdd: false
  runner:
    available: false # Nota: no hay runner configurado en pom.xml ni en frontend/package.json
  layers:
    unit:
      available: false
    integration:
      available: false
    e2e:
      available: false
  coverage:
    available: false
  quality:
    linter:
      available: false # Nota: no existe script de lint
    type_checker:
      tool: tsc y javac
      command: npm run build (frontend); mvn compile (backend)
    formatter:
      available: false

## SDD Rules for This Project
rules:
  proposal:
    - Include DB schema changes (Cambios en el grafo: nodos, relaciones, propiedades)
    - Identify permission requirements (Autenticación y autorización afectada)
    - Reference domain module dependencies (Puertos y adaptadores afectados)
  specs:
    - Use Given/When/Then for scenarios
    - Specify query behavior (Consultas Cypher esperadas, nodos/relaciones retornadas)
    - Define validation rules (Constraints en Neo4j, validación en Quarkus)
  design:
    - Document entity relationships (Grafo: :Usuario, :Post, :MensajeChat y relaciones SIGUE, PUBLICA, REACCIONA)
    - Show Hexagonal Architecture ports/adapters used
  tasks:
    - Group by phase: Domain Model → Ports → Service → Adapter → Resources
    - Keep tasks atomic
  apply:
    - Follow existing Quarkus Hexagonal patterns (domain/port/application/infrastructure)
    - No migrations SQL: usar Neo4j y dataset semilla docker/neo4j-seed.cql
  verify:
    - Run compile checks: mvn compile && cd ../frontend && npm run build
    - (Tests disabled until runner is added)

## CI/CD
ci:
  commands:
    - mvn compile
    - cd ../frontend && npm run build

