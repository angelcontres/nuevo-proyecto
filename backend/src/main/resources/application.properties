# Quarkus HTTP Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# Configuración de Conexión a Neo4j (Protocolo Bolt)
quarkus.neo4j.uri=${QUARKUS_NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${QUARKUS_NEO4J_AUTHENTICATION_USERNAME:neo4j}
quarkus.neo4j.authentication.password=${QUARKUS_NEO4J_AUTHENTICATION_PASSWORD:password123}

# Configuración de MinIO / Amazon S3
quarkus.s3.endpoint-override=${S3_ENDPOINT:http://localhost:9000}
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
quarkus.s3.path-style-access=true
redsocial.s3.bucket=${S3_BUCKET:redsocial-media}

# Configuración de Notificaciones Web Push (VAPID)
redsocial.vapid.public-key=${VAPID_PUBLIC_KEY:BGw-ejemploClavePublicaVAPID...}
redsocial.vapid.private-key=${VAPID_PRIVATE_KEY:ejemploClavePrivadaVAPID...}
redsocial.vapid.subject=${VAPID_SUBJECT:mailto:admin@redsocial.edu.ec}

# SmallRye OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
